
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BikeGO! - Delivery Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
      
      html, body, #root {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: 'Inter', sans-serif;
      }
      
      .leaflet-container {
        width: 100%;
        height: 100% !important;
        background: #0a0a0b !important;
        outline: none;
      }
      
      /* --- FILTRO MÁGICO: DARK MODE + ESTRADAS LARANJA --- */
      .map-tiles-dark {
        filter: invert(100%) hue-rotate(155deg) brightness(0.9) contrast(1.2) saturate(2.5) !important;
      }

      .custom-marker { background: transparent; border: none; }

      .user-location-marker { background: transparent; border: none; }
      .user-dot {
        width: 18px; height: 18px; background-color: #ff8000; border: 3px solid white;
        border-radius: 50%; box-shadow: 0 0 20px rgba(255, 128, 0, 0.8);
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 20;
      }
      .user-pulse {
        width: 50px; height: 50px; background-color: rgba(255, 128, 0, 0.2);
        border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        animation: pulse-ring 2s infinite; z-index: 10;
      }
      @keyframes pulse-ring {
        0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
        100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
      }

      /* Splash Animations */
      @keyframes motor-vibration {
        0%, 100% { transform: translateY(0) rotate(-0.5deg); }
        50% { transform: translateY(-3px) rotate(0.5deg); }
      }
      .animate-motor { animation: motor-vibration 0.08s infinite linear; }

      @keyframes exhaust-puff {
        0% { transform: translate(0, 0) scale(1); opacity: 0.6; }
        100% { transform: translate(-60px, -30px) scale(3); opacity: 0; }
      }
      .exhaust {
        position: absolute; width: 12px; height: 12px; background: rgba(255,128,0,0.4);
        border-radius: 50%; animation: exhaust-puff 0.4s ease-out infinite;
      }

      .wind-line {
        position: absolute; height: 2px; background: linear-gradient(90deg, transparent, rgba(255,128,0,0.6), transparent);
        animation: wind-fast 0.3s linear infinite;
      }
      @keyframes wind-fast {
        0% { transform: translateX(300%); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translateX(-300%); opacity: 0; }
      }
    </style>
